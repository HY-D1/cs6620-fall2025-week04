name: Docker Build, Push, and Deploy

on:
  push:
    branches:
      - week02   # change if you use a different branch

jobs:
  build:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_CS6620 }}
          password: ${{ secrets.DOCKERHUB_CS6620_TOKEN }}


      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_CS6620 }}/cs6620-app:latest
          labels: |
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Check required secrets (Docker Hub)
        run: |
          test -n "${{ secrets.DOCKERHUB_CS6620 }}" || (echo "Missing DOCKERHUB_CS6620" && exit 1)
          test -n "${{ secrets.DOCKERHUB_CS6620_TOKEN }}" || (echo "Missing DOCKERHUB_CS6620_TOKEN" && exit 1)



  deploy:
    name: Deploy to EC2 via AWS SSM
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }} # REQUIRED in Learner Lab
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Send SSM Run Command to EC2
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "CI deploy cs6620-app via SSM" \
            --parameters 'commands=[
              "echo --- Pull latest image ---",
              "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest",
              "echo --- Stop old container (ok if missing) ---",
              "docker stop cs6620-app 2>/dev/null || true",
              "docker rm cs6620-app 2>/dev/null || true",
              "echo --- Start new container ---",
              "docker run -d -p 80:5000 --restart unless-stopped --name cs6620-app ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest",
              "echo --- Show running containers ---",
              "docker ps --format \"table {{.Names}}\t{{.Image}}\t{{.Status}}\"",
              "echo --- Done ---"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Wait for command to finish & print output
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm.outputs.COMMAND_ID }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          echo "===== SSM Output ====="
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.COMMAND_ID }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'StandardOutputContent' \
            --output text
