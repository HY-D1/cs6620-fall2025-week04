name: Docker Build, Push, and Deploy

on:
  push:
    branches:
      - week02   # change if you use a different branch

jobs:
  build:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_CS6620 }}
          password: ${{ secrets.DOCKERHUB_CS6620_TOKEN }}


      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_CS6620 }}/cs6620-app:latest
          labels: |
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Check required secrets (Docker Hub)
        run: |
          test -n "${{ secrets.DOCKERHUB_CS6620 }}" || (echo "Missing DOCKERHUB_CS6620" && exit 1)
          test -n "${{ secrets.DOCKERHUB_CS6620_TOKEN }}" || (echo "Missing DOCKERHUB_CS6620_TOKEN" && exit 1)



  deploy:
    name: Deploy to EC2 via AWS SSM
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }} # REQUIRED in Learner Lab
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM (robust)
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "CI deploy cs6620-app via SSM" \
            --parameters 'commands=[
              "set -eux",
              "echo --- OS info ---",
              "cat /etc/os-release || true",
              "uname -a || true",
      
              "echo --- Install Docker if missing ---",
              "if ! command -v docker >/dev/null 2>&1; then",
              "  if command -v dnf >/dev/null 2>&1; then sudo dnf install -y docker;",
              "  elif command -v yum >/dev/null 2>&1; then sudo yum install -y docker;",
              "  elif command -v apt-get >/dev/null 2>&1; then sudo apt-get update -y && sudo apt-get install -y docker.io;",
              "  else echo No known package manager; exit 1; fi",
              "fi",
      
              "echo --- Enable/start Docker ---",
              "sudo systemctl enable docker || true",
              "sudo systemctl start docker || true",
              "sudo systemctl is-active docker",
      
              "echo --- Free port 80 if busy ---",
              "sudo fuser -k 80/tcp || true",
      
              "echo --- Pull latest image ---",
              "sudo docker pull ${{ secrets.DOCKERHUB_CS6620 }}/cs6620-app:latest",
      
              "echo --- Stop/remove old container (ok if missing) ---",
              "sudo docker stop cs6620-app 2>/dev/null || true",
              "sudo docker rm cs6620-app 2>/dev/null || true",
      
              "echo --- Run new container (80->5000) ---",
              "sudo docker run -d -p 80:5000 --restart unless-stopped --name cs6620-app ${{ secrets.DOCKERHUB_CS6620 }}/cs6620-app:latest",
      
              "echo --- Show containers ---",
              "sudo docker ps",
      
              "echo --- Try health endpoint ---",
              "curl -fsS http://localhost/health || true"
            ]' \
            --query 'Command.CommandId' --output text)
      
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_OUTPUT"
