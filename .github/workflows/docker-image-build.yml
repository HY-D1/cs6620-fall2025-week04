name: Python CI + Docker Publish

on:
  push:
    branches: [ "week02" ] 
  pull_request:
    branches: [ "week02" ]  

jobs:
  docker:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    env:
      # Hardcode your Docker Hub username (not secret)
      DOCKERHUB_USERNAME: harrydhy
      # Map your single secret to the token
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CS6620 }}
      IMAGE_NAME: harrydhy/cs6620-app

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check secret present
        run: |
          if [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "Missing DOCKERHUB_CS6620 secret (token)."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=
          labels: |
            org.opencontainers.image.title=cs6620-app
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
